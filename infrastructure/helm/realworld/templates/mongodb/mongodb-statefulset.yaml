{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mongodb
    component: database
spec:
  serviceName: mongodb
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        component: database
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        runAsNonRoot: false
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: mongodb
        image: {{ .Values.mongodb.image }}
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: realworld-secret
              key: MONGO_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: realworld-secret
              key: MONGO_ROOT_PASSWORD
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: realworld-config
              key: MONGO_DB_NAME
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-config
          mountPath: /data/configdb
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - "echo 'db.runCommand(\"ping\").ok' | mongosh mongodb://{{ .Values.mongodb.auth.username }}:{{ .Values.mongodb.auth.password }}@localhost:27017/admin --quiet"
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - "echo 'db.runCommand(\"ping\").ok' | mongosh mongodb://{{ .Values.mongodb.auth.username }}:{{ .Values.mongodb.auth.password }}@localhost:27017/admin --quiet"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 20
          failureThreshold: 5
        resources:
          {{- toYaml .Values.mongodb.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      {{- if and .Values.monitoring.enabled .Values.monitoring.mongodb.exporter.enabled }}
      - name: mongodb-exporter
        image: {{ .Values.monitoring.mongodb.exporter.image }}
        ports:
        - containerPort: {{ .Values.monitoring.mongodb.exporter.port }}
          name: metrics
        env:
        - name: MONGODB_URI
          value: "mongodb://{{ .Values.mongodb.auth.username }}:{{ .Values.mongodb.auth.password }}@localhost:27017/admin"
        resources:
          {{- toYaml .Values.monitoring.mongodb.exporter.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
            - ALL
      {{- end }}
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: mongodb-config
        emptyDir: {}
{{- end }}