{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
    component: api
    {{- if .Values.monitoring.enabled }}
    monitoring: "true"
    {{- end }}
spec:
  ports:
  - port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}
    name: http
  selector:
    app: backend
  type: ClusterIP
{{- end }}