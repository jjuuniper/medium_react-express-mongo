global:
  namespace: realworld-staging
  environment: staging

replicaCount:
  backend: 1
  frontend: 1

image:
  backend:
    tag: dev
    pullPolicy: Always
  frontend:
    tag: dev
    pullPolicy: Always

mongodb:
  storage: 2Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m
  auth:
    username: admin
    password: demo123
    database: realworld

backend:
  env:
    nodeEnv: development
    jwtSecret: dev-jwt-secret-change-in-production

frontend:
  env:
    nodeEnv: development
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

ingress:
  host: realworld-dev.local

networkPolicy:
  enabled: false

# Monitoring overrides for development
monitoring:
  serviceMonitor:
    interval: 30s  # Less frequent scraping in dev

  alerts:
    enabled: false  # No alerts in dev

  mongodb:
    exporter:
      enabled: false  # Skip MongoDB exporter in dev to save resources