apiVersion: v1
kind: Secret
metadata:
  name: realworld-secret
  namespace: realworld
type: Opaque
data:
  # PRODUCTION TEMPLATE - DO NOT USE AS-IS
  # Replace these placeholder values with real secrets:
  #
  # To generate base64 encoded secrets:
  # echo -n 'your-username' | base64
  # echo -n 'your-strong-password' | base64
  # echo -n 'your-jwt-secret' | base64
  #
  # For production deployment:
  # 1. Copy this file to secret-prod.yaml (gitignored)
  # 2. Replace placeholder values with real base64 encoded secrets
  # 3. Deploy: kubectl apply -f k8s/secrets/secret-prod.yaml
  #
  # Or use CI/CD with environment variables:
  # kubectl create secret generic realworld-secret \
  #   --from-literal=MONGO_ROOT_USERNAME="$MONGO_USERNAME" \
  #   --from-literal=MONGO_ROOT_PASSWORD="$MONGO_PASSWORD" \
  #   --from-literal=ACCESS_TOKEN_SECRET="$JWT_SECRET" \
  #   --from-literal=DATABASE_URI="mongodb://$MONGO_USERNAME:$MONGO_PASSWORD@mongodb:27017/realworld?authSource=admin"

  MONGO_ROOT_USERNAME: <BASE64_ENCODED_USERNAME>
  MONGO_ROOT_PASSWORD: <BASE64_ENCODED_PASSWORD>
  ACCESS_TOKEN_SECRET: <BASE64_ENCODED_JWT_SECRET>
  DATABASE_URI: <BASE64_ENCODED_DATABASE_URI>