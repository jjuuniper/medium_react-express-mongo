# Environment-agnostic secret configuration
#
# For specific environments, use:
# Development: kubectl apply -f k8s/secrets/secret-dev.yaml
# Production:  kubectl apply -f k8s/secrets/secret-prod.yaml (create from template)
#
# Or create secrets dynamically via CI/CD:
# kubectl create secret generic realworld-secret \
#   --from-literal=MONGO_ROOT_USERNAME="$MONGO_USERNAME" \
#   --from-literal=MONGO_ROOT_PASSWORD="$MONGO_PASSWORD" \
#   --from-literal=ACCESS_TOKEN_SECRET="$JWT_SECRET" \
#   --from-literal=DATABASE_URI="mongodb://$MONGO_USERNAME:$MONGO_PASSWORD@mongodb:27017/realworld?authSource=admin"
#
# This file is kept for reference - use environment-specific secrets instead.

# apiVersion: v1
# kind: Secret
# metadata:
#   name: realworld-secret
#   namespace: realworld
# type: Opaque
# data:
#   MONGO_ROOT_USERNAME: <BASE64_VALUE>
#   MONGO_ROOT_PASSWORD: <BASE64_VALUE>
#   ACCESS_TOKEN_SECRET: <BASE64_VALUE>
#   DATABASE_URI: <BASE64_VALUE>