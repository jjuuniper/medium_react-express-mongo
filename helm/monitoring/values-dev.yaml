# Development Monitoring Stack Configuration
# kube-prometheus-stack values for development environment
#
# Install with:
# helm install monitoring prometheus-community/kube-prometheus-stack \
#   -f monitoring-values-dev.yaml -n monitoring --create-namespace

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Single replica for development (no HA needed)
    replicas: 1

    # Short retention for development
    retention: 7d
    retentionSize: 10GB

    # No persistent storage in dev (ephemeral)
    storageSpec: {}

    # Minimal resources for development
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m

    # Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Service monitors selector - discover all ServiceMonitors
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Prometheus rules selector - discover all PrometheusRules
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Pod monitors selector
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

# Grafana configuration
grafana:
  enabled: true
  replicas: 1

  # Development admin credentials (NOT for production!)
  adminPassword: admin

  # No persistent storage in dev
  persistence:
    enabled: false

  # Resources for Grafana
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

  # Datasources - Prometheus auto-configured
  # Dashboards auto-discovered via ConfigMaps with label grafana_dashboard: "1"

  # Service configuration
  service:
    type: ClusterIP
    port: 80

# Alertmanager configuration
alertmanager:
  # Disabled in development
  enabled: false

# Kube-state-metrics - keep enabled for Kubernetes metrics
kubeStateMetrics:
  enabled: true

# Node exporter - disabled in dev to save resources
nodeExporter:
  enabled: false

# Prometheus operator configuration
prometheusOperator:
  enabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# Default rules - disable most alerts in development
defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: false
    k8s: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: false
    network: false
    node: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    prometheus: false
    prometheusOperator: false
