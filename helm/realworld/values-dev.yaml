global:
  environment: development

replicaCount:
  backend: 1
  frontend: 1

image:
  backend:
    tag: dev
  frontend:
    tag: dev

mongodb:
  storage: 2Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  auth:
    username: admin
    password: demo123
    database: realworld

backend:
  env:
    nodeEnv: development
    jwtSecret: dev-jwt-secret-change-in-production

frontend:
  env:
    nodeEnv: development

ingress:
  host: realworld-dev.local

networkPolicy:
  enabled: false