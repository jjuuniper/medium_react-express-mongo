{{- if and .Values.mongodb.auth.username .Values.mongodb.auth.password .Values.backend.env.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: realworld-secret
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  MONGO_ROOT_USERNAME: {{ .Values.mongodb.auth.username | b64enc }}
  MONGO_ROOT_PASSWORD: {{ .Values.mongodb.auth.password | b64enc }}
  ACCESS_TOKEN_SECRET: {{ .Values.backend.env.jwtSecret | b64enc }}
  DATABASE_URI: {{ printf "mongodb://%s:%s@mongodb:27017/%s?authSource=admin" .Values.mongodb.auth.username .Values.mongodb.auth.password .Values.mongodb.auth.database | b64enc }}
{{- else }}
# Secret not created - missing required values
# Provide secrets via:
# 1. Environment-specific values file (e.g., values-dev.yaml)
# 2. Command line: --set mongodb.auth.password="secret"
# 3. Local secrets file: values-local-secrets.yaml
# 4. External secret management (Vault, etc.)
{{- end }}