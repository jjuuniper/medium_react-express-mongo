version: '3.8'

services:
  # MongoDB Database Service (same as production)
  mongodb:
    image: mongo:6
    container_name: realworld-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-realworld}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-realworld}
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
      # Mount initialization script to create test database
      - ./backend/mongodb-init:/docker-entrypoint-initdb.d
    ports:
      # Expose MongoDB port for development debugging
      - "27017:27017"
    networks:
      - realworld-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Node.js Application Service (Development with hot reload)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    image: realworld-backend:dev
    container_name: realworld-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/${MONGO_DB_NAME:-realworld}?authSource=admin
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-secret-key-change-in-production}
    ports:
      - "4000:4000"
      # Optional: Expose debugger port
      - "9229:9229"
    volumes:
      # Mount source code for hot reloading
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - realworld-network-dev
    command: ["npm", "run", "dev"]

  # Next.js Frontend Service (Development with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    image: realworld-frontend:dev
    container_name: realworld-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_BASE_URL: http://app:4000/api
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reloading
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - app
    networks:
      - realworld-network-dev
    command: ["npm", "run", "dev"]

  # Test Service (Dedicated test container)
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: realworld-test
    environment:
      NODE_ENV: test
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET_TEST:-test-secret-key-for-testing}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-realworld}
      DATABASE_URI: mongodb://mongodb:27017/realworld_test
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - realworld-network-dev
    depends_on:
      - mongodb
    profiles:
      - test
    command: ["npm", "test"]

# Named volumes for development data persistence
volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local

# Custom network for development container communication
networks:
  realworld-network-dev:
    driver: bridge