name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ============================================================================
  # Stage 1: Parallel Quality & Security Checks
  # ============================================================================

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: frontend
        run: npm run format:check

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        env:
          MONGO_HOST: localhost
          MONGO_ROOT_USERNAME: admin
          MONGO_ROOT_PASSWORD: password123
          MONGO_DB_NAME: realworld
          ACCESS_TOKEN_SECRET: test-secret-key-for-ci-testing-only
        run: npm run test:coverage

      - name: Check coverage threshold
        working-directory: backend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Error: Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  typecheck-frontend:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript compiler
        working-directory: frontend
        run: npx tsc --noEmit

  security-secrets:
    name: Security - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for TruffleHog

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  security-dependencies:
    name: Security - Dependency Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Run npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high
        continue-on-error: false

  security-sast:
    name: Security - SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/nodejs
            p/react
            p/docker

  # ============================================================================
  # Stage 2: Build Docker Images (Local Only - No Push)
  # ============================================================================

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend, security-secrets, security-dependencies, security-sast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:build-${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ hashFiles('backend/package-lock.json') }}
          cache-to: type=gha,mode=max,scope=backend-${{ hashFiles('backend/package-lock.json') }}
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [lint-frontend, typecheck-frontend, security-secrets, security-dependencies, security-sast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:build-${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ hashFiles('frontend/package-lock.json') }}
          cache-to: type=gha,mode=max,scope=frontend-${{ hashFiles('frontend/package-lock.json') }}
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          retention-days: 1

  # ============================================================================
  # Stage 3: Scan Images with Trivy (Security Gate)
  # ============================================================================

  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    needs: [build-backend]
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load backend image
        run: docker load --input /tmp/backend-image.tar

      - name: Print vulnerabilities (for debugging)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:build-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail, just print

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:build-${{ github.sha }}
          format: 'sarif'
          output: 'backend-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail if vulnerabilities found

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'backend-trivy-results.sarif'
          category: 'backend-image'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:build-${{ github.sha }}
          format: 'cyclonedx'
          output: 'backend-sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
          retention-days: 90

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    needs: [build-frontend]
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Load frontend image
        run: docker load --input /tmp/frontend-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:build-${{ github.sha }}
          format: 'sarif'
          output: 'frontend-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail if vulnerabilities found

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'frontend-trivy-results.sarif'
          category: 'frontend-image'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:build-${{ github.sha }}
          format: 'cyclonedx'
          output: 'frontend-sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend-sbom.json
          retention-days: 90

  # ============================================================================
  # Stage 4: Push Images (Only if Scans Pass & on develop/main)
  # ============================================================================

  push-images:
    name: Push Images to Registry
    runs-on: ubuntu-latest
    needs: [scan-backend, scan-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Load images
        run: |
          docker load --input /tmp/backend-image.tar
          docker load --input /tmp/frontend-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "BACKEND_TAGS=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:develop,${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:develop-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "FRONTEND_TAGS=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:develop,${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:develop-${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            VERSION=$(cat backend/package.json | jq -r '.version')
            echo "BACKEND_TAGS=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${VERSION},${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${VERSION}-${{ github.sha }},${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:main,${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
            echo "FRONTEND_TAGS=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${VERSION},${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${VERSION}-${{ github.sha }},${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:main,${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Tag and push backend image
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.BACKEND_TAGS }}"
          for TAG in "${TAGS[@]}"; do
            docker tag ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:build-${{ github.sha }} $TAG
            docker push $TAG
          done

      - name: Tag and push frontend image
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.FRONTEND_TAGS }}"
          for TAG in "${TAGS[@]}"; do
            docker tag ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:build-${{ github.sha }} $TAG
            docker push $TAG
          done

  # ============================================================================
  # Summary
  # ============================================================================

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [push-images]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.push-images.result }}" == "success" ] || [ "${{ needs.push-images.result }}" == "skipped" ]; then
            echo "✅ CI Pipeline completed successfully"
          else
            echo "❌ CI Pipeline failed"
            exit 1
          fi
