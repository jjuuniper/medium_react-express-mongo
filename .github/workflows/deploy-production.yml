name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0 or latest)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend
  NAMESPACE: realworld-production

jobs:
  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required for actions/checkout
    environment:
      name: production
      url: https://realworld.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # Always deploy from main branch

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl with kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Validate version exists
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Validating version: $VERSION"

          # Check if images exist in registry
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:$VERSION || {
            echo "Error: Backend image with version $VERSION not found"
            exit 1
          }

          docker manifest inspect ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:$VERSION || {
            echo "Error: Frontend image with version $VERSION not found"
            exit 1
          }

          echo "✅ Images validated successfully"

      - name: Create namespace with Helm ownership
        run: |
          if ! kubectl get namespace ${{ env.NAMESPACE }} &> /dev/null; then
            echo "Creating namespace ${{ env.NAMESPACE }}"
            kubectl create namespace ${{ env.NAMESPACE }}
            kubectl label namespace ${{ env.NAMESPACE }} app.kubernetes.io/managed-by=Helm
            kubectl annotate namespace ${{ env.NAMESPACE }} \
              meta.helm.sh/release-name=realworld \
              meta.helm.sh/release-namespace=${{ env.NAMESPACE }}
          else
            echo "Namespace ${{ env.NAMESPACE }} already exists"
          fi

      - name: Create imagePullSecret for GHCR
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=${{ github.actor }}@users.noreply.github.com \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create backup of current deployment
        run: |
          echo "Creating backup of current production deployment..."

          # Get current deployment
          kubectl get deployment backend -n ${{ env.NAMESPACE }} -o yaml > /tmp/backend-deployment-backup.yaml || true
          kubectl get deployment frontend -n ${{ env.NAMESPACE }} -o yaml > /tmp/frontend-deployment-backup.yaml || true

          # Store current image versions
          CURRENT_BACKEND=$(kubectl get deployment backend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")
          CURRENT_FRONTEND=$(kubectl get deployment frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")

          echo "CURRENT_BACKEND=$CURRENT_BACKEND" >> $GITHUB_ENV
          echo "CURRENT_FRONTEND=$CURRENT_FRONTEND" >> $GITHUB_ENV

          echo "Current backend: $CURRENT_BACKEND"
          echo "Current frontend: $CURRENT_FRONTEND"

      - name: Deploy with Helm
        id: deploy
        run: |
          VERSION="${{ github.event.inputs.version }}"

          echo "Deploying version $VERSION to production..."

          helm upgrade --install realworld ./infrastructure/helm/realworld \
            --namespace ${{ env.NAMESPACE }} \
            -f ./infrastructure/helm/realworld/values.yaml \
            -f ./infrastructure/helm/realworld/values-prod.yaml \
            --set image.backend.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }} \
            --set image.backend.tag=$VERSION \
            --set image.frontend.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }} \
            --set image.frontend.tag=$VERSION \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod --all -n ${{ env.NAMESPACE }} --timeout=600s

          echo "Deployment status:"
          kubectl get deployments -n ${{ env.NAMESPACE }}

          echo "Pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }}

          echo "Service status:"
          kubectl get services -n ${{ env.NAMESPACE }}

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          echo "Running production smoke tests..."

          # Health check for backend
          echo "Testing backend health endpoint..."
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
            curl -f http://backend:4000/api/health || {
              echo "❌ Backend health check failed"
              exit 1
            }

          echo "Testing frontend..."
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
            curl -f http://frontend:3000 || {
              echo "❌ Frontend health check failed"
              exit 1
            }

          echo "✅ Smoke tests passed"

      - name: Monitor deployment
        run: |
          echo "Monitoring deployment for 2 minutes..."
          sleep 120

          # Check for CrashLoopBackOff or other issues
          FAILING_PODS=$(kubectl get pods -n ${{ env.NAMESPACE }} --field-selector=status.phase!=Running,status.phase!=Succeeded -o json | jq -r '.items | length')

          if [ "$FAILING_PODS" -gt "0" ]; then
            echo "❌ Found $FAILING_PODS failing pods"
            kubectl get pods -n ${{ env.NAMESPACE }}
            exit 1
          fi

          echo "✅ All pods running successfully"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ env.NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Previous Backend:** ${{ env.CURRENT_BACKEND }}" >> $GITHUB_STEP_SUMMARY
          echo "**Previous Frontend:** ${{ env.CURRENT_FRONTEND }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**New Backend:** ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**New Frontend:** ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pod Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed! Initiating rollback..."

          if [ "${{ env.CURRENT_BACKEND }}" != "none" ]; then
            echo "Rolling back to previous version..."
            helm rollback realworld -n ${{ env.NAMESPACE }} || {
              echo "Helm rollback failed, attempting manual rollback..."
              kubectl apply -f /tmp/backend-deployment-backup.yaml || true
              kubectl apply -f /tmp/frontend-deployment-backup.yaml || true
            }

            echo "Waiting for rollback to complete..."
            kubectl wait --for=condition=ready pod --all -n ${{ env.NAMESPACE }} --timeout=300s || true

            echo "Rollback complete. Current status:"
            kubectl get pods -n ${{ env.NAMESPACE }}
          else
            echo "No previous deployment found. Manual intervention required."
          fi

          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "Deployment failed and rollback was attempted." >> $GITHUB_STEP_SUMMARY
          echo "Please verify the production environment manually." >> $GITHUB_STEP_SUMMARY

          exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Version ${{ github.event.inputs.version }} is now live in production."
